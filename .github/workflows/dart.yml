name: Build Flutter iOS (lab309)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build IPA (no codesign - for personal iPhone)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lab309-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
