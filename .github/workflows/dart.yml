name: Build Flutter iOS (lab309)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14  # Giữ macos-14, ổn định cho iOS 2025
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app  # Chọn Xcode 15.4 (mặc định macos-14)

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept  # Fix lỗi license fail sớm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update  # Cài Pods (thường thiếu gây fail)

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS (no codesign - verbose for debug)
        run: flutter build ipa --release --no-codesign --verbose  # Đổi thành build ipa (tạo .ipa trực tiếp) + verbose để log chi tiết nếu fail

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lab309-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
